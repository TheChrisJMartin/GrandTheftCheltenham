<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grand Theft Cheltenham</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; font-family: system-ui, sans-serif; }
    #gameCanvas { display: block; width: 100%; height: 100%; background: #2d4a2d; }
    #streetBanner {
      position: absolute; top: 0; left: 0; right: 0;
      height: 40px; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0) 100%);
      color: #fff; font-size: 18px; font-weight: 700; letter-spacing: 1.2px;
      text-shadow: 0 1px 4px #000; pointer-events: none; z-index: 5;
      padding-top: 6px;
    }
    #streetBanner span { opacity: 0.95; }
    #hud {
      position: absolute; top: 48px; left: 12px; color: #eee;
      background: rgba(0,0,0,0.55); padding: 8px 12px; border-radius: 6px;
      font-size: 13px; line-height: 1.4; pointer-events: none;
      min-width: 180px; z-index: 5;
    }
    #roadToast {
      position: absolute; top: 22%; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.75); color: #fff; font-size: 26px; font-weight: 700;
      letter-spacing: 1px; padding: 10px 28px; border-radius: 4px;
      opacity: 0; transition: opacity 0.35s; pointer-events: none; z-index: 5;
      text-shadow: 0 1px 3px #000;
    }
    #roadToast.visible { opacity: 1; }
    #titleSplash {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #0d0d0d;
      color: #f0f0f0; z-index: 10; transition: opacity 0.6s;
    }
    #titleSplash h1 { font-size: 2.6rem; margin-bottom: 0.4rem; letter-spacing: 2px; }
    #titleSplash p { opacity: 0.7; margin-bottom: 1.5rem; }
    #titleSplash button {
      padding: 12px 32px; font-size: 1.1rem; background: #c45c26; color: #fff;
      border: none; border-radius: 6px; cursor: pointer;
    }
    #titleSplash button:hover { background: #e07030; }
  </style>
</head>
<body>
  <div id="titleSplash">
    <h1>Grand Theft Cheltenham</h1>
    <p>Top-down driving - 10-mile radius - v0.12.1</p>
    <button id="startBtn">Start Driving</button>
  </div>
  <canvas id="gameCanvas"></canvas>
  <div id="streetBanner"><span id="streetName">-</span></div>
  <div id="hud">
    <div>FPS: <span id="fps">-</span></div>
    <div>Speed: <span id="speed">0</span> mph</div>
    <div>Heading: <span id="heading">0</span> deg</div>
    <div>Pos: <span id="pos">-</span></div>
    <div id="debugExtra"></div>
  </div>
  <div id="roadToast"></div>
  <script src="js/game.js"></script>
</body>
</html>
